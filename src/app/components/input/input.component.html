<div class="input-container">
    <label>{{ label }}</label>
    <input 
        [type]="type" 
        [placeholder]="placeholder" 
        [disabled]="disabled" 
        (input)="onInput($event)"
        [mask]="mask">
    <ng-container *ngIf="error">
        <div class="input-error">
            <ng-container *ngTemplateOutlet="error"></ng-container>
        </div>
    </ng-container>
</div>
