<div class="input-container">
  <span class="input-label">{{ label }}</span>
  <input
    [type]="type"
    [placeholder]="placeholder"
    [disabled]="disabled"
    (input)="onInput($event)"
    [value]="value"
    >
    @if (error) {
      <div class="input-error">
        <ng-container *ngTemplateOutlet="error"></ng-container>
      </div>
    }
  </div>
