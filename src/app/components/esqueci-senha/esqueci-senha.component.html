<div class="card-formulario">
    <mat-card class="card-container esqueci-senha">
        <div class="titulo-section-card">Recuperação de Senha</div>
        <div style="display: flex; flex-direction: column; margin-bottom: 1rem;">
            Para a mudança de senha, vai ser enviado um código para o seu email cadastrado.
        </div>
        <form class="formulario-container">
            <div class="input-container">
                <label>Código</label>
                <input type="number">
            </div>
            <div class="input-container">
                <label>Senha Nova</label>
                <input type="password">
            </div>
            <div class="buttons-container-space-around">
                <button (click)="deveRedirecionarParaTelaLogin()">Voltar</button>
                <button>Cadastrar Nova Senha</button>
            </div>
        </form>
    </mat-card>
</div>
