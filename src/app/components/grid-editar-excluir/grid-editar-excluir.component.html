<div class="tabela-card">

  <div class="table-wrapper">

    <table
      mat-table
      [dataSource]="dados"
      class="tabela-container">

      <!-- COLUNAS -->
      <ng-container *ngFor="let coluna of _colunas">

        <ng-container [matColumnDef]="coluna.key">

          <th mat-header-cell *matHeaderCellDef>
            {{ coluna.label }}
          </th>

          <td mat-cell *matCellDef="let row">

            <!-- EDIÇÃO -->
            <ng-container
              *ngIf="isEditing(row); else viewMode"
              [ngTemplateOutlet]="rowEditTemplate"
              [ngTemplateOutletContext]="{
                $implicit: row,
                form: form,
                coluna: coluna
              }">
            </ng-container>

            <!-- VISUALIZAÇÃO -->
            <ng-template #viewMode>

              <ng-container
                *ngIf="coluna.template; else defaultTemplate"
                [ngTemplateOutlet]="coluna.template"
                [ngTemplateOutletContext]="{
                  $implicit: row
                }">
              </ng-container>

              <ng-template #defaultTemplate>
                {{ row[coluna.key] }}
              </ng-template>

            </ng-template>

          </td>

        </ng-container>

      </ng-container>

      <!-- AÇÕES -->
      <ng-container matColumnDef="acoes">

        <th mat-header-cell *matHeaderCellDef>
          Ações
        </th>

        <td mat-cell *matCellDef="let row">

          <app-icon-button
            *ngIf="!isEditing(row)"
            (click)="onEditar(row)"
            [icone]="'edit'"
            [cor]="'warning'">
          </app-icon-button>

          <app-icon-button
            *ngIf="!isEditing(row)"
            (click)="onDelete(row)"
            [icone]="'delete'"
            [cor]="'danger'">
          </app-icon-button>

          <app-icon-button
            *ngIf="isEditing(row)"
            (click)="onConfirmar(row)"
            [icone]="'done'"
            [cor]="'success'">
          </app-icon-button>

          <app-icon-button
            *ngIf="isEditing(row)"
            (click)="onCancelar()"
            [icone]="'cancel'"
            [cor]="'danger'">
          </app-icon-button>

        </td>

      </ng-container>

      <!-- HEADER -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns; sticky: true">
      </tr>

      <!-- ROWS -->
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;">
      </tr>

      <!-- SEM DADOS -->
      <tr
        class="mat-row"
        *matNoDataRow>

        <td
          class="mat-cell"
          [attr.colspan]="displayedColumns.length">

          <div class="no-data">
            Nenhum registro encontrado
          </div>

        </td>

      </tr>

    </table>

  </div>

  <div class="adicionar-icon">
    <app-icon-button
      (click)="adicionarLinha()"
      [icone]="'add'"
      [cor]="'primary'"
      [desabilitado]="editandoLinha">
    </app-icon-button>
  </div>

</div>
